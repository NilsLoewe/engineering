# Core rules: always loaded, in every world and stack. World overlays add their own rules.
# Budget 2 KB (tools/build_katalog.py). A rule only enters when it holds for every project.
- id: kern-test-fails-without-fix
  regel: Every new guard, branch or fix has a test that fails when the change is removed; happy-path-only or self-confirming tests do not count.
- id: kern-reuse-existing-pattern
  regel: Before adding a helper, hook, scope or component, find how the codebase already does it and reuse that; never add a second way.
- id: kern-no-silent-failure
  regel: Never swallow an error or return early without a trace; report it (error tracker, error state, user message) or let it fail loudly.
- id: kern-remove-dead-code
  regel: Remove dead code in the same change - unused methods, exports, variables, props, branches.
- id: kern-comment-why-only
  regel: A comment states a why, an invariant or a deliberate omission of the current code; no history, ticket numbers or other repos' internals.
- id: kern-no-secrets-in-logs
  regel: Keep secrets and personal data out of logs, job arguments, error reports and the browser console.
- id: kern-pr-text-matches-code
  regel: The PR description matches the code - behaviour, deploy order, manual steps; unrelated changes go into their own PR.
- id: kern-check-the-other-side
  regel: Check every cross-repo contract (field, casing, nullability, version, deploy order) in the other repo's source, not by assumption.
- id: kern-validate-input
  regel: Validate every request parameter and every value interpolated into a path, query or regex.
- id: kern-honest-names
  regel: Names say what a thing is in domain terms; rename when the scope grows.
- id: kern-query-once
  regel: Do not run the same query, request or parse twice in one path; no per-row fan-out.
