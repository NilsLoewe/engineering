# Lenses and how a diff selects them (pfade: fnmatch globs on changed files; inhalt: regex on added lines).
- name: design
  titel: Design and code smells
  absicht: >-
    Intent: every fact, state and variation has one home, so the next change touches one place.
    A finding names the second place that a future change would have to remember; duplication that
    exists only in a hypothetical future is not a finding.
  stack: beide
  pfade:
  - app/*
  - lib/*
  - src/*
  inhalt: ^\s*(def|class|module|function|export|case|switch)\b|=>\s*\{|useState|is_a\?|kind_of\?|Faraday|^\s*(#|//)
- name: ux
  titel: 'UX: states, feedback, controls and wording'
  absicht: >-
    Intent: a user always knows what the screen shows, what just happened and what to do next.
    A finding names the user, the moment and what they miss or misread; a matter of taste is not a finding.
    Missing outcome, error or empty state is major; layout and wording are minor.
  stack: frontend
  pfade:
  - '*.tsx'
  - '*.jsx'
  - '*.vue'
  - '*.svelte'
  - '*.erb'
  - '*.heex'
  - '*.html'
  inhalt: <[A-Za-z]
